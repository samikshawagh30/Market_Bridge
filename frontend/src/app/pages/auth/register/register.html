<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="card shadow p-4">

        <h2 class="text-center mb-2">
          MarketBridge
        </h2>

        <p class="text-center text-muted mb-4">          Create Account
        </p>
        <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input
              type="text"
              class="form-control"
              formControlName="fullName"
              placeholder="Enter your full name">
            <div
              class="text-danger mt-1"
              *ngIf="registerForm.get('fullName')?.touched &&
                     registerForm.get('fullName')?.invalid">
              Full Name is required.
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              formControlName="email"
              placeholder="Enter your email">
            <div
              class="text-danger mt-1"
              *ngIf="registerForm.get('email')?.touched &&
                     registerForm.get('email')?.invalid">
              Valid email is required.
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Mobile Number</label>
            <input
              type="text"
              class="form-control"
              formControlName="mobile"
              placeholder="Enter your mobile number">
            <div
              class="text-danger mt-1"
              *ngIf="registerForm.get('mobile')?.touched &&
                     registerForm.get('mobile')?.invalid">
              Mobile number is required.
            </div>
          </div>          <div class="mb-3">
            <label class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              formControlName="password"
              placeholder="Enter your password">
            <div
              class="text-danger mt-1"
              *ngIf="registerForm.get('password')?.touched &&
                     registerForm.get('password')?.invalid">
              Password must be at least 6 characters.
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input
              type="password"
              class="form-control"
              formControlName="confirmPassword"
              placeholder="Confirm your password">
            <div
              class="text-danger mt-1"
              *ngIf="registerForm.get('confirmPassword')?.touched &&
                     registerForm.get('confirmPassword')?.invalid">
              Confirm Password is required.
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label d-block">
              Role
            </label>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                value="Farmer"
                formControlName="role"
                id="farmer">
              <label
                class="form-check-label"
                for="farmer">
                Farmer
              </label>
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                value="Buyer"
                formControlName="role"
                id="buyer">
              <label
                class="form-check-label"
                for="buyer">
                Buyer
              </label>
            </div>
          </div>
                    <button
            type="submit"
            class="btn btn-success w-100"
            [disabled]="registerForm.invalid">
            Register
          </button>
          <div class="text-center mt-3">
            <span>Already have an account?</span>
            <a
              routerLink="/login"
              class="text-decoration-none ms-1">
              Login
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
